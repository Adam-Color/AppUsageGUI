name: Build & Package

permissions:
  contents: read

on:
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag:
        description: "Release tag (e.g. v1.11.2)"
        required: true
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: tcl-tk upgrade
        run: brew install tcl-tk

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14t"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          # Use the correct Python interpreter
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Build binary
        run: .venv/bin/python build.py

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Build macOS installer
        run: |
          chmod +x dev/macos_installer.sh
          bash dev/macos_installer.sh

      - name: Flatten artifact path
        run: |
          # Move the DMG to a known location at the workspace root
          cp dist/AppUsageGUI_v*_macOS_setup.dmg .

      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          path: AppUsageGUI_v*_macOS_setup.dmg
          archive: false
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14t"

      - name: Create virtual environment
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build binary
        run: .venv\Scripts\python.exe build.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Windows installer
        run: |
          # Read version from _version.py
          $version = python -c "import sys; sys.path.insert(0, 'src'); from _version import __version__; print(__version__)"
          # Replace version in .iss file
          (Get-Content dev\windows_installer.iss) -replace '#define MyAppVersion ".*"', "#define MyAppVersion `"$version`"" | Set-Content dev\windows_installer.iss
          # Build installer
          iscc dev\windows_installer.iss

      - name: Flatten artifact path
        run: |
          # Move the DMG to a known location at the workspace root
          cp dist/AppUsageGUI_v*_WINDOWS_setup.exe .

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: AppUsageGUI_v*_WINDOWS_setup.exe
          archive: false
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Verify release exists
        run: |
          gh release view "${{ github.event.inputs.tag || github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            artifacts/**/*_macOS_setup.dmg
            artifacts/**/*_WINDOWS_setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
